# 推送与 manifest.json 版本号相同的 tag（不带 v，例如 0.7.0）时，
# 建一个草稿 Release 并附上 Obsidian 安装需要的三个文件；确认无误后在 GitHub 上手动发布
name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches manifest and versions.json
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(jq -r .version manifest.json)"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $tag 与 manifest.json 的版本 $version 不一致"
            exit 1
          fi
          if [ "$(jq -r --arg v "$version" '.[$v] // empty' versions.json)" = "" ]; then
            echo "::error::versions.json 里缺少 $version"
            exit 1
          fi
          node --check main.js

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --draft \
            --generate-notes \
            main.js manifest.json styles.css
